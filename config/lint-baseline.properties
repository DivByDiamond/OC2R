# Lint ratchet baseline (docs/roadmap/quality.md §39 lint stages, Ступень B).
#
# The `lintRatchet` Gradle task counts violations in the Checkstyle/PMD XML
# reports and FAILS the build when any count grows above the values below.
# After intentionally fixing violations, lower the matching value here so the
# ratchet tracks the new (smaller) debt; never raise a value to "allow" a
# regression — that defeats the ratchet. Keys: <tool><SourceSet>, values: max
# allowed violations.
checkstyleMain=0
checkstyleTest=0
pmdMain=0
pmdTest=0

# core module (counts wired into lintRatchet from core/build/reports/**):
coreCheckstyleMain=0
coreCheckstyleTest=0
corePmdMain=0
corePmdTest=0
