pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}
rootProject.name = "oc2r-${minecraft_version}-${minecraft_sdk}"

def substituteLocal(final directoryName, final libraryName) {
    final def path = new File("../${directoryName}")
    if (path.exists()) {
        println("Found local [${directoryName}] project, substituting...")
        includeBuild(path) {
            dependencySubstitution {
                substitute module(libraryName) using project(':')
            }
        }
    }
}

// Auto-fetch the three GitHub-Release-only runtime deps (ceres, sedna,
// sedna-buildroot) into libs/ in a Maven layout before any project
// configuration runs. This makes `./gradlew build` work straight out of
// `git clone` without needing GITHUB_ACTOR/GITHUB_TOKEN set or remembering
// to run ./scripts/download-libs.sh manually.
//
// Why here and not in build.gradle: the `jarJar(implementation(...))`
// declarations in build.gradle are resolved at configuration time, so by
// the time build.gradle runs it's already too late — Gradle has already
// tried and failed to fetch the jars from the remote Maven repos. Doing
// the fetch in settings.gradle (which runs first) makes the local Maven
// layout under libs/ visible to the subsequent resolution.
//
// Re-runs are cheap: download-libs.sh itself skips files that already
// exist, so this is a no-op on subsequent builds.
gradle.settingsEvaluated {
    def rootDir = settings.rootDir
    def marker = new File(rootDir, "libs/li/cil/sedna/sedna-buildroot/0.0.64/sedna-buildroot-0.0.64.jar")
    if (!marker.isFile()) {
        def script = new File(rootDir, "scripts/download-libs.sh")
        if (script.isFile()) {
            println("GitHub-Release-only deps (ceres/sedna/sedna-buildroot) missing from libs/ — running download-libs.sh once...")
            def pb = new ProcessBuilder("bash", script.getAbsolutePath())
                .directory(rootDir)
                .redirectErrorStream(true)
            def proc = pb.start()
            def stdout = proc.inputStream.text
            proc.waitFor()
            if (proc.exitValue() != 0) {
                System.err.println(stdout)
                throw new GradleException(
                    "Failed to auto-fetch GitHub-hosted deps via scripts/download-libs.sh (exit code ${proc.exitValue()}).\n" +
                    "Either fix the network issue and re-run, or set GITHUB_ACTOR/GITHUB_TOKEN to use the authenticated GitHub Packages repo instead.\n" +
                    "Script output is above."
                )
            } else {
                println(stdout)
            }
        }
    }
}

substituteLocal('ceres', 'li.cil.ceres:ceres')
substituteLocal('sedna', 'li.cil.sedna:sedna')
substituteLocal('minux', 'li.cil.sedna:sedna-buildroot')
