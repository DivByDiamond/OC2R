#file: noinspection UndefinedAction,UndefinedParamsPresent
name: publish

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set release type to 'release'
        run: |
          echo "RELEASE_TYPE=release" >> $GITHUB_ENV
        if: github.event.release.prerelease == false
      - name: Set release type to 'alpha'
        run: |
          echo "RELEASE_TYPE=alpha" >> $GITHUB_ENV
        if: github.event.release.prerelease == true

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Publish to Curseforge, Modrinth & GitHub Packages
        run: ./gradlew -Psemver='${{ github.event.release.tag_name }}' -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }} publish publishGprPublicationToGitHubPackagesRepository
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          CHANGELOG: ${{ github.event.release.body }}
          GITHUB_TOKEN: ${{ github.token }}
        # Modrinth version_number regex allows only [a-zA-Z0-9._-]:
        # strip the leading 'v' from the tag name and never append '+git' (build.gradle.kts).
        # Tag your releases WITHOUT the 'v' prefix, e.g. 0.1.0, and this stays clean.

      - name: Add Artifacts to Github Release
        uses: alexellis/upload-assets@0.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          asset_paths: '["./build/libs/*.jar"]'

      - name: Resolve artifact path
        run: |
          FILE=$(ls build/libs/oc2r-1.21.1-neoforge-"${GITHUB_REF_NAME#v}"*.jar | head -n1)
          echo "CF_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_API_KEY }}
          project_id: '1657848'
          game_endpoint: 'minecraft'
          file_path: ${{ env.CF_FILE }}
          display_name: 'OC2R ${{ github.event.release.tag_name }} for Minecraft 1.21.1 (NeoForge)'
          release_type: ${{ github.event.release.prerelease == true && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          changelog_type: 'markdown'
          game_versions: '1.21.1'
          java_version: '21'
          loaders: 'neoforge'
