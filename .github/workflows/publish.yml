#file: noinspection UndefinedAction,UndefinedParamsPresent
name: publish

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    permissions:
      contents: write
      packages: write
    # Self-hosted runner pool.
    runs-on: pocketprobe-kube

    steps:
      - name: Set release type to 'release'
        run: |
          echo "RELEASE_TYPE=release" >> $GITHUB_ENV
        if: github.event.release.prerelease == false
      - name: Set release type to 'alpha'
        run: |
          echo "RELEASE_TYPE=alpha" >> $GITHUB_ENV
        if: github.event.release.prerelease == true

      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Build artifacts
        run: ./gradlew -Psemver='${{ github.event.release.tag_name }}' build
        env:
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          GITHUB_TOKEN: ${{ github.token }}

      # Legacy: publish the maven artifact to GitHub Packages. Kept non-blocking —
      # a failure here must not prevent the CurseForge upload below.
      - name: Publish to GitHub Packages
        continue-on-error: true
        run: ./gradlew -Psemver='${{ github.event.release.tag_name }}' -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }} publishGprPublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Modrinth version_number regex allows only [a-zA-Z0-9._-]:
      # strip the leading 'v' from the tag name and never append '+git' (build.gradle.kts).
      # Tag your releases WITHOUT the 'v' prefix, e.g. 0.1.0, and this stays clean.
      - name: Resolve artifact path
        id: artifact
        run: |
          FILE=$(ls build/libs/oc2r-1.21.1-neoforge-*.jar | grep -v -- '-api\.jar' | head -n1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Add Artifacts to Github Release
        uses: alexellis/upload-assets@0.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          asset_paths: '["./build/libs/*.jar"]'

      - name: Upload to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1657848
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          files: ${{ steps.artifact.outputs.path }}
          name: OC2R ${{ github.event.release.tag_name }} for Minecraft 1.21.1 (NeoForge)
          version-type: ${{ github.event.release.prerelease == true && 'beta' || 'release' }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
