name: build

on:
  workflow_dispatch:
  push:
    branches: [ '1.21.1' ]
    tags: [ 'v*' ]

jobs:
  build:
    permissions:
      contents: write
      packages: write
    # Self-hosted runner pool (see test/actions-runner for the original experiment).
    runs-on: pocketprobe-kube

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download dependencies
        run: bash scripts/download-libs.sh

      - name: build
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: oc2r-artifacts
          path: build/libs/*.jar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS=()
          # Tags with a suffix (v0.1.1-beta.1, v0.2.0-rc1, ...) are prereleases.
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              "${ARGS[@]}" \
              build/libs/*.jar
          else
            echo "Release already exists, skipping creation."
          fi
