name: build

on:
  workflow_dispatch:
  push:
    branches: [ '1.21.1' ]
    tags: [ 'v*' ]

jobs:
  build:
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download dependencies
        run: bash scripts/download-libs.sh

      - name: build
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: oc2r-artifacts
          path: build/libs/*.jar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            build/libs/*.jar
