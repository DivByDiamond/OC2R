name: build

on:
  workflow_dispatch:
  push:
    branches: [ '1.21.1' ]
    tags: [ 'v*' ]

jobs:
  build:
    permissions:
      contents: write
      packages: write
    # Self-hosted runner pool (see test/actions-runner for the original experiment).
    runs-on: pocketprobe-kube
    # No concurrency cancel-in-progress here (unlike ci-work.yml): this job
    # can publish a release, and cancelling a release build mid-upload is
    # worse than a queued duplicate. A timeout is still worth it in case the
    # runner wedges. The 26.x mod nodes are compiled as well, which needs more
    # than the 1.21.1-only budget.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download dependencies
        run: bash scripts/download-libs.sh

      - name: Assemble all six targets
        # CI owns tests and static analysis. This job produces every release JAR;
        # assemble also avoids starting legacy GameTests without an xvfb setup.
        # Retry one transient Maven resolution failure before failing the build.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          VERSION_ARGS=()
          if [ -n "$TAG_NAME" ]; then
            VERSION_ARGS+=("-Psemver=$TAG_NAME")
          fi
          TASKS=(:1.21.1:assemble :26.1.2:assemble :26.2:assemble
                 :fabric:1.21.1:assemble :fabric:26.1.2:assemble :fabric:26.2:assemble)
          ./gradlew "${VERSION_ARGS[@]}" "${TASKS[@]}" || {
            echo "::warning::First Gradle assembly failed; retrying dependency resolution."
            ./gradlew "${VERSION_ARGS[@]}" "${TASKS[@]}" --refresh-dependencies
          }

      - name: Stage all six release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          mkdir -p dist
          shopt -s nullglob
          collect() {
            local directory="$1" output="$2" file
            local candidates=()
            for file in "$directory"/*.jar; do
              case "$file" in
                *-sources.jar|*-dev.jar|*-api.jar) continue ;;
              esac
              candidates+=("$file")
            done
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one release JAR in $directory, found ${#candidates[@]}."
              return 1
            fi
            cp -- "${candidates[0]}" "$output"
          }
          for NODE in 1.21.1 26.1.2 26.2; do
            collect "versions/$NODE/build/libs" "dist/oc2r-$NODE-neoforge-$VERSION.jar"
            collect "fabric/versions/$NODE/build/libs" "dist/oc2r-$NODE-fabric-$VERSION.jar"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: oc2r-artifacts
          path: |
            versions/1.21.1/build/libs/*.jar
            fabric/versions/*/build/libs/*.jar
            versions/26.1.2/build/libs/*.jar
            versions/26.2/build/libs/*.jar

      # The self-hosted pool does not guarantee gh is present: a beta.3.1 rerun
      # landed on a runner without gh and Create Release failed with exit 127.
      - name: Ensure gh CLI
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL -o /tmp/gh.tgz \
              https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz
            tar -xzf /tmp/gh.tgz -C /tmp
            echo "/tmp/gh_2.62.0_linux_amd64/bin" >> "$GITHUB_PATH"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          ARGS=()
          # Tags with a suffix (v0.1.1-beta.1, v0.2.0-rc1, ...) are prereleases.
          if [[ "$TAG_NAME" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --target "$RELEASE_COMMIT" \
              --verify-tag \
              --generate-notes \
              "${ARGS[@]}" \
              dist/*.jar
          else
            echo "Release already exists, skipping creation."
          fi
