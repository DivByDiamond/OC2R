name: ci

# Continuous integration for the development branch: compile, tests and static
# analysis on every push / PR. Releases are handled by build.yml (tags) and
# publish.yml (releases) — this workflow never publishes anything.

on:
  workflow_dispatch:
  push:
    branches: [ 'work' ]
  pull_request:
    branches: [ 'work' ]

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download dependencies
        run: bash scripts/download-libs.sh

      # `build` includes check: tests + PMD + Checkstyle + SpotBugs.
      - name: Build and verify
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/reports/pmd/
            build/reports/checkstyle/
            build/reports/spotbugs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: oc2r-dev-jar
          path: build/libs/*.jar
