name: ci

# Continuous integration for both the dev branch (work) and PRs into the
# release branch (1.21.1): compile, tests and static analysis. Releases are
# handled by build.yml (tags) and publish.yml (releases) -- this workflow
# never publishes anything. `pull_request: [work, 1.21.1]` exists because
# build.yml only triggers on `push` (post-merge) -- without this, a PR
# targeting 1.21.1 got zero automated verification before merge.
#
# The pipeline is split into three jobs that share the pool and run in
# parallel (lint / unit tests / game tests -- each dominates a different
# bottleneck: static analysis CPU, JVM tests, MC server boot). Formally the
# branch is still gated by a single check: the `ci` result job below.
# NOTE: paths-ignore applies to `push` only. On pull_request every change --
# docs included -- must produce the `ci` check, or a docs-only PR would sit in
# "Expected - Waiting for status" forever once `ci` is a required check.
on:
  workflow_dispatch:
  push:
    branches: [ 'work' ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE', 'SECURITY.md' ]
  pull_request:
    branches: [ 'work', '1.21.1' ]

# A new push to the same PR/branch makes the previous run's result moot --
# cancel it instead of letting stale runs pile up on the (limited) self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    runs-on: pocketprobe-kube
    # Static analysis on compiled classes (spotbugs) -- compile is needed but
    # no game server; the whole job is CPU-bound gradle work.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download dependencies
        run: bash scripts/download-libs.sh

      - name: Static analysis (checkstyle + pmd + spotbugs + ratchet)
        # Transient 5xx from maven.neoforged.net aborts Gradle resolution (unlike 404
        # it is not treated as "not found"); one retry recovers the same way build.yml does.
        run: |
          ./gradlew checkstyleMain checkstyleTest pmdMain pmdTest spotbugsMain spotbugsTest lintRatchet || {
            echo "::warning::First lint gradle run failed (likely transient dependency resolution); retrying."
            ./gradlew checkstyleMain checkstyleTest pmdMain pmdTest spotbugsMain spotbugsTest lintRatchet --refresh-dependencies
          }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            build/reports/pmd/
            build/reports/checkstyle/
            build/reports/spotbugs/
          if-no-files-found: ignore
          retention-days: 1

  test:
    permissions:
      contents: read
    runs-on: pocketprobe-kube
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download dependencies
        run: bash scripts/download-libs.sh

      - name: Verify bundled fonts
        run: |
          ls -lh src/main/resources/assets/oc2r/fonts/
          if command -v file >/dev/null 2>&1; then file src/main/resources/assets/oc2r/fonts/*.ttf || true; fi
          for f in src/main/resources/assets/oc2r/fonts/*.ttf; do
            sz=$(wc -c < "$f"); echo "$f $sz"; [ "$sz" -gt 100000 ] || { echo "font truncated: $f"; exit 1; }
          done

      # `test` runs the JUnit suite (incl. the vttest replay harness); `assemble`
      # builds the mod jar so the job still guards packaging regressions.
      - name: Unit tests and jar assembly
        run: |
          ./gradlew test assemble || {
            echo "::warning::First test gradle run failed (likely transient dependency resolution); retrying."
            ./gradlew test assemble --refresh-dependencies
          }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/test-results/test/*.xml
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: oc2r-dev-jar
          path: build/libs/*.jar

  gametest:
    permissions:
      contents: read
    runs-on: pocketprobe-kube
    # Booting the MC server dominates this job; the timeout is tuned above the
    # slowest known-good full-suite run.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download dependencies
        run: bash scripts/download-libs.sh

      - name: Run game tests
        run: |
          ./gradlew gameTest || {
            echo "::warning::First gameTest gradle run failed (likely transient dependency resolution); retrying."
            ./gradlew gameTest --refresh-dependencies
          }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The gameTest task fails on a vacuous run and always emits
      # build/test-results/gameTest/results.xml; missing XML therefore means
      # the task did not run at all -- upload with `error` so that is visible.
      - name: Upload game test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gametest-results
          path: 'build/test-results/gameTest/*.xml'
          if-no-files-found: error
          retention-days: 1

  ci:
    # Single formal check aggregating the parallel jobs; branch protection can
    # require `ci` only. `if: always()` so the check still reports (red) when a
    # leg fails, instead of staying pending forever.
    name: ci
    needs: [ lint, test, gametest ]
    if: always()
    permissions:
      contents: read
    runs-on: pocketprobe-kube
    timeout-minutes: 5
    steps:
      - name: Evaluate result
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          GAMETEST: ${{ needs.gametest.result }}
        run: |
          for r in "$LINT" "$TEST" "$GAMETEST"; do
            if [ "$r" != "success" ]; then
              echo "failure leg: lint=$LINT test=$TEST gametest=$GAMETEST"
              exit 1
            fi
          done
          echo "all legs green"
